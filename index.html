<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PERSONS AND FAMILY LAW REVIEWER BY PCGNG</title>
  <style>
    :root {
      --bg-canvas: #070b13;
      --pane-dark: #0d1524;
      --border-line: #1c2a3f;
      --accent-yellow: #f59e0b;
      --accent-cyan: #38bdf8;
      --accent-pink: #f472b6;
      --cream-card: #f8f6f0;
      --cream-text: #1a1a1a;
      --text-main: #f1f5f9;
      --text-muted: #8492a6;
      --read-green: #34d399;
      --bookmark-blue: #38bdf8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-canvas);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header Bar */
    header {
      background-color: #0b111c;
      border-bottom: 1px solid var(--border-line);
      padding: 0 20px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .app-title {
      font-size: 1.32rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--accent-pink);
    }
    .badge-mode {
      font-size: 0.93rem;
      color: #34d399;
      border: 1px solid #059669;
      background: rgba(5, 150, 105, 0.15);
      padding: 3px 10px;
      border-radius: 14px;
      font-weight: 700;
    }
    .btn-print {
      background: var(--accent-yellow);
      color: #000;
      font-weight: 700;
      font-size: 1.08rem;
      padding: 7px 16px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    /* 3-Pane Workspace Grid */
    .reviewer-workspace {
      display: grid;
      grid-template-columns: 380px 1.15fr 1.35fr;
      gap: 14px;
      padding: 14px;
      flex: 1;
      overflow: hidden;
    }

    .pane-card {
      background: var(--pane-dark);
      border: 1px solid var(--border-line);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .pane-titlebar {
      height: 48px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-line);
      background: rgba(11, 17, 28, 0.85);
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      flex-shrink: 0;
      gap: 8px;
    }

    .pane-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .pane-content {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
    }

    /* Tree Header Toggle Controls */
    .btn-tree-toggle {
      background: transparent;
      border: 1px solid var(--border-line);
      color: var(--text-muted);
      font-size: 0.82rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
      cursor: pointer;
      text-transform: none;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .btn-tree-toggle:hover {
      color: #fff;
      border-color: #64748b;
    }
    .btn-jump-bookmark {
      color: var(--bookmark-blue);
      border-color: rgba(56, 189, 248, 0.35);
    }
    .btn-jump-bookmark:hover:not(:disabled) {
      background: rgba(56, 189, 248, 0.15);
      border-color: var(--bookmark-blue);
      color: #fff;
    }
    .btn-jump-bookmark:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      color: var(--text-muted);
      border-color: var(--border-line);
    }

    /* Column 1: Collapsible Tree Styles */
    .module-group { 
      margin-bottom: 14px;
      border-bottom: 1px solid rgba(30, 41, 59, 0.5);
      padding-bottom: 8px;
    }
    
    .module-header {
      font-size: 1.10rem;
      font-weight: 700;
      color: var(--accent-yellow);
      padding: 6px 8px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      user-select: none;
      transition: background 0.15s ease;
    }
    .module-header:hover {
      background: rgba(245, 158, 11, 0.12);
    }
    .module-header-title {
      display: flex;
      align-items: center;
      gap: 8px;
      line-height: 1.35;
    }
    .module-toggle-arrow {
      font-size: 0.85rem;
      color: var(--text-muted);
      transition: transform 0.2s ease;
      flex-shrink: 0;
    }

    .module-subtopics {
      margin-top: 6px;
      margin-left: 6px;
      display: block;
    }
    .module-subtopics.collapsed {
      display: none;
    }

    /* Subtopic Row with Bookmark */
    .subtopic-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 6px;
      padding: 7px 10px;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 3px;
      border-left: 3px solid transparent;
      transition: background 0.15s ease;
    }
    .subtopic-row:hover, .subtopic-row.active {
      background: rgba(56, 189, 248, 0.15);
    }
    .subtopic-row.active .subtopic-label {
      font-weight: 700;
    }
    .subtopic-row.bookmarked-item {
      border-left: 3px solid var(--bookmark-blue);
      background: rgba(56, 189, 248, 0.10);
    }
    .subtopic-label {
      flex: 1;
      font-size: 1.08rem;
      color: var(--accent-cyan);
      line-height: 1.35;
      word-break: break-word;
    }
    .subtopic-row.read-subtopic .subtopic-label {
      color: var(--read-green);
      opacity: 0.9;
    }

    .case-tree-list {
      list-style: none;
      margin-left: 14px;
      margin-top: 4px;
      margin-bottom: 8px;
    }
    .case-tree-item {
      font-size: 1.00rem;
      color: #94a3b8;
      padding: 5px 8px;
      border-radius: 5px;
      cursor: pointer;
      line-height: 1.35;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 6px;
      border-left: 3px solid transparent;
      transition: background 0.15s ease;
    }
    .case-tree-item:hover, .case-tree-item.active {
      color: var(--accent-pink);
      background: rgba(244, 114, 182, 0.18);
      font-weight: 600;
    }
    .case-tree-item.read-case {
      color: #6ee7b7;
      opacity: 0.88;
    }
    .case-tree-item.read-case:hover {
      color: #a7f3d0;
    }
    .case-tree-item.bookmarked-item {
      border-left: 3px solid var(--bookmark-blue);
      background: rgba(56, 189, 248, 0.12);
    }

    .case-title-label {
      flex: 1;
      word-break: break-word;
    }

    /* Star & Bookmark Icon Controls inside Syllabus */
    .item-markers {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .marker-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 1.05rem;
      line-height: 1;
      padding: 2px 3px;
      border-radius: 3px;
      color: #475569; /* Neutral gray default matching star */
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.12s ease, color 0.15s ease;
    }
    .marker-btn:hover {
      transform: scale(1.2);
      color: #cbd5e1;
      background: rgba(255, 255, 255, 0.08);
    }
    .marker-btn.starred {
      color: var(--accent-yellow);
      text-shadow: 0 0 6px rgba(245, 158, 11, 0.45);
    }
    .marker-btn.bookmarked {
      color: var(--bookmark-blue); /* Bright blue when clicked */
      filter: drop-shadow(0 0 4px rgba(56, 189, 248, 0.65));
    }
    .marker-btn.bookmarked svg {
      fill: var(--bookmark-blue);
    }

    /* Column 2: Overview (Parchment Card & PDF Viewer) */
    .overview-container {
      background-color: #0b111c;
      padding: 12px;
      height: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .parchment-sheet {
      background: var(--cream-card);
      color: var(--cream-text);
      height: 100%;
      border-radius: 8px;
      padding: 28px;
      overflow-y: auto;
      font-size: 1.35rem;
      line-height: 1.75;
      white-space: pre-wrap;
      word-break: break-word;
      text-align: justify;
      text-justify: inter-word;
    }
    .parchment-sheet strong {
      font-weight: 800;
      color: #000;
    }
    .parchment-sheet em {
      font-style: italic;
    }

    /* Subtopic Divider (---) */
    .subtopic-divider {
      border: 0;
      height: 2px;
      background: linear-gradient(to right, #cbd5e1, #94a3b8, #cbd5e1);
      margin: 26px 0 22px 0;
    }

    /* Bullet Lists in Overview */
    .overview-bullet {
      margin-left: 24px;
      text-indent: -16px;
      margin-bottom: 6px;
    }
    .overview-sub-bullet {
      margin-left: 44px;
      text-indent: -16px;
      margin-bottom: 6px;
    }

    /* Embedded PDF Frame */
    .pdf-viewer-frame {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 8px;
      background: #1e293b;
    }

    /* Article Highlighter (Active ONLY at the start of lines in Middle Pane) */
    .article-badge {
      color: #0369a1; 
      background-color: #fce7f3;
      border: 1px solid #fbcfe8;
      padding: 1px 6px;
      border-radius: 4px;
      font-weight: 800;
      display: inline-block;
      line-height: 1.35;
      text-indent: 0;
    }

    /* Column 3: Case Digest */
    .digest-path {
      font-size: 1.02rem;
      color: var(--accent-yellow);
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .case-headline {
      font-family: Georgia, serif;
      font-size: 2.02rem;
      font-weight: 700;
      color: var(--accent-pink);
      margin-bottom: 22px;
      line-height: 1.35;
    }

    /* Section Headings with Distinct Separator Line */
    .badge-label {
      font-size: 1.10rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      margin-top: 28px;
      margin-bottom: 12px;
      padding-top: 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .color-doctrines { color: #f97316; }
    .color-facts     { color: #f59e0b; }
    .color-issue     { color: #ec4899; }
    .color-held      { color: #10b981; }
    .color-ratio     { color: #38bdf8; }
    .color-fallo     { color: #a78bfa; }

    .digest-block {
      margin-bottom: 24px;
      font-size: 1.28rem;
      color: #cbd5e1;
      line-height: 1.75;
      white-space: pre-wrap;
      text-align: justify;
      text-justify: inter-word;
    }
    .digest-block strong {
      font-weight: 800;
      color: #ffffff;
    }
    .digest-block em {
      font-style: italic;
      color: #e2e8f0;
    }

    .btn-pane-action {
      background: transparent;
      border: 1px solid var(--border-line);
      color: var(--text-muted);
      font-size: 0.90rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      text-transform: none;
      white-space: nowrap;
    }
    .btn-pane-action:hover { color: #fff; border-color: #64748b; }
    .btn-pane-action:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      border-color: var(--border-line);
      color: var(--text-muted);
    }
    
    .btn-read-toggle.is-read {
      background: rgba(16, 185, 129, 0.18);
      border-color: #059669;
      color: #34d399;
    }

    .btn-pdf-toggle {
      color: var(--accent-pink);
      border-color: rgba(244, 114, 182, 0.35);
    }
    .btn-pdf-toggle:hover {
      background: rgba(244, 114, 182, 0.15);
      border-color: var(--accent-pink);
      color: #fff;
    }
    .btn-pdf-toggle.active-pdf {
      background: rgba(244, 114, 182, 0.25);
      border-color: var(--accent-pink);
      color: #fff;
    }

    .btn-next-case {
      color: var(--accent-cyan);
      border-color: rgba(56, 189, 248, 0.3);
    }
    .btn-next-case:hover:not(:disabled) {
      background: rgba(56, 189, 248, 0.12);
      border-color: var(--accent-cyan);
      color: #fff;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-group">
      <div class="app-title">⚖️ PERSONS AND FAMILY LAW REVIEWER BY PCGNG</div>
      <div class="badge-mode">3-PANE SYLLABUS VIEW</div>
    </div>
    <button class="btn-print" onclick="window.print()">Print / PDF</button>
  </header>

  <main class="reviewer-workspace">
    <!-- Col 1: Left Pane (Syllabus Hierarchy) -->
    <section class="pane-card">
      <div class="pane-titlebar">
        <span>📁 Syllabus</span>
        <div class="pane-actions">
          <button class="btn-tree-toggle btn-jump-bookmark" id="btnJumpBookmark" title="Jump to bookmarked position">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
            Bookmark
          </button>
          <button class="btn-tree-toggle" id="btnToggleAll">Collapse All</button>
        </div>
      </div>
      <div class="pane-content" id="syllabusTree">Loading syllabus...</div>
    </section>

    <!-- Col 2: Middle Pane (Topic Overview & PDF Toggle) -->
    <section class="pane-card">
      <div class="pane-titlebar">
        <span style="white-space: nowrap;">• Overview</span>
        <span style="color: var(--accent-yellow); font-size: 0.92rem; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" id="activeSubtopicLabel">OUTLINE</span>
        <div class="pane-actions">
          <button class="btn-pane-action btn-pdf-toggle" id="btnTogglePdf">📄 View PDF</button>
          <button class="btn-pane-action btn-read-toggle" id="btnMarkOverviewRead">Mark as Read</button>
        </div>
      </div>
      <div class="overview-container" id="overviewContainer">
        <div class="parchment-sheet" id="overviewDisplay">
          Select a topic or subtopic from the syllabus tree on the left.
        </div>
      </div>
    </section>

    <!-- Col 3: Right Pane (Case Digest) -->
    <section class="pane-card">
      <div class="pane-titlebar">
        <span># Case Digest</span>
        <div class="pane-actions">
          <button class="btn-pane-action btn-read-toggle" id="btnMarkRead">Mark as Read</button>
          <button class="btn-pane-action btn-next-case" id="btnNextCase">Next Case ⏭</button>
          <button class="btn-pane-action" id="btnCopyRatio">Copy Ratio</button>
        </div>
      </div>
      <div class="pane-content" id="digestDisplay">
        <p style="color: var(--text-muted); font-size: 1.25rem;">Select any case from the syllabus to view its digest.</p>
      </div>
    </section>
  </main>

  <script>
    let currentSyllabus = [];
    let currentRatioText = "";
    let currentCaseItem = null;
    let currentSubtopicItem = null;
    let currentCaseIndex = -1;
    let flattenedCases = [];
    let flattenedSubtopics = [];
    let allCollapsed = false;
    let isPdfMode = false;

    const BOOKMARK_SVG = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>`;

    /* --- LocalStorage Helpers --- */
    function getReadCases() {
      try {
        const stored = localStorage.getItem('pfr_read_cases');
        return stored ? new Set(JSON.parse(stored)) : new Set();
      } catch (e) { return new Set(); }
    }
    function saveReadCases(set) {
      localStorage.setItem('pfr_read_cases', JSON.stringify([...set]));
    }

    function getReadSubtopics() {
      try {
        const stored = localStorage.getItem('pfr_read_subtopics');
        return stored ? new Set(JSON.parse(stored)) : new Set();
      } catch (e) { return new Set(); }
    }
    function saveReadSubtopics(set) {
      localStorage.setItem('pfr_read_subtopics', JSON.stringify([...set]));
    }

    function getStarredCases() {
      try {
        const stored = localStorage.getItem('pfr_starred_cases');
        return stored ? new Set(JSON.parse(stored)) : new Set();
      } catch (e) { return new Set(); }
    }
    function saveStarredCases(set) {
      localStorage.setItem('pfr_starred_cases', JSON.stringify([...set]));
    }

    /* Unified Bookmark (supports both 'case' and 'subtopic') */
    function getBookmark() {
      try {
        const raw = localStorage.getItem('pfr_bookmark_v2');
        if (raw) return JSON.parse(raw);
        // Migrate legacy case-only bookmark if present
        const legacy = localStorage.getItem('pfr_bookmarked_case');
        return legacy ? { type: 'case', id: legacy } : null;
      } catch (e) { return null; }
    }

    function setBookmark(type, id) {
      if (type && id) {
        localStorage.setItem('pfr_bookmark_v2', JSON.stringify({ type, id }));
      } else {
        localStorage.removeItem('pfr_bookmark_v2');
      }
      localStorage.removeItem('pfr_bookmarked_case');
      updateAllBookmarkUI();
    }

    function toggleBookmark(type, id) {
      const current = getBookmark();
      if (current && current.type === type && current.id === id) {
        setBookmark(null, null);
      } else {
        setBookmark(type, id);
      }
    }

    function updateAllBookmarkUI() {
      const bm = getBookmark();
      const jumpBtn = document.getElementById('btnJumpBookmark');
      jumpBtn.disabled = !bm;

      // Update Case Items
      document.querySelectorAll('.case-tree-item').forEach(li => {
        const id = li.getAttribute('data-case-id');
        const btn = li.querySelector('.bookmark-toggle-btn');
        const isMatch = bm && bm.type === 'case' && bm.id === id;
        li.classList.toggle('bookmarked-item', !!isMatch);
        if (btn) {
          btn.classList.toggle('bookmarked', !!isMatch);
          btn.title = isMatch ? 'Bookmarked (Where I stopped) - Click to remove' : 'Bookmark this case';
        }
      });

      // Update Subtopic Items
      document.querySelectorAll('.subtopic-row').forEach(row => {
        const id = row.getAttribute('data-sub-id');
        const btn = row.querySelector('.bookmark-toggle-btn');
        const isMatch = bm && bm.type === 'subtopic' && bm.id === id;
        row.classList.toggle('bookmarked-item', !!isMatch);
        if (btn) {
          btn.classList.toggle('bookmarked', !!isMatch);
          btn.title = isMatch ? 'Bookmarked (Where I stopped) - Click to remove' : 'Bookmark this subtopic';
        }
      });
    }

    /* --- Star & Read Toggles --- */
    function toggleStarCase(caseId) {
      const starred = getStarredCases();
      if (starred.has(caseId)) {
        starred.delete(caseId);
      } else {
        starred.add(caseId);
      }
      saveStarredCases(starred);
      updateCaseTreeItem(caseId);
    }

    function toggleCaseReadStatus(caseId) {
      const readSet = getReadCases();
      if (readSet.has(caseId)) {
        readSet.delete(caseId);
      } else {
        readSet.add(caseId);
      }
      saveReadCases(readSet);
      updateReadButton(caseId);
      updateCaseTreeItem(caseId);
    }

    function toggleSubtopicReadStatus(subId) {
      const readSet = getReadSubtopics();
      if (readSet.has(subId)) {
        readSet.delete(subId);
      } else {
        readSet.add(subId);
      }
      saveReadSubtopics(readSet);
      updateOverviewReadButton(subId);
      updateSubtopicTreeItem(subId);
    }

    function updateReadButton(caseId) {
      const btn = document.getElementById('btnMarkRead');
      if (!caseId) {
        btn.style.display = 'none';
        return;
      }
      btn.style.display = 'inline-flex';
      const readSet = getReadCases();
      if (readSet.has(caseId)) {
        btn.classList.add('is-read');
        btn.textContent = '✓ Read';
      } else {
        btn.classList.remove('is-read');
        btn.textContent = 'Mark as Read';
      }
    }

    function updateOverviewReadButton(subId) {
      const btn = document.getElementById('btnMarkOverviewRead');
      if (!subId) {
        btn.style.display = 'none';
        return;
      }
      btn.style.display = 'inline-flex';
      const readSet = getReadSubtopics();
      if (readSet.has(subId)) {
        btn.classList.add('is-read');
        btn.textContent = '✓ Read';
      } else {
        btn.classList.remove('is-read');
        btn.textContent = 'Mark as Read';
      }
    }

    function updateCaseTreeItem(caseId) {
      const li = document.querySelector(`.case-tree-item[data-case-id="${caseId}"]`);
      if (!li) return;
      const readSet = getReadCases();
      const starredSet = getStarredCases();
      const isRead = readSet.has(caseId);
      const isStarred = starredSet.has(caseId);
      const title = li.getAttribute('data-case-title');

      const titleSpan = li.querySelector('.case-title-label');
      if (titleSpan) {
        titleSpan.textContent = isRead ? `✓ ${title}` : `# ${title}`;
      }

      li.classList.toggle('read-case', isRead);

      const starBtn = li.querySelector('.star-toggle-btn');
      if (starBtn) {
        starBtn.classList.toggle('starred', isStarred);
        starBtn.textContent = isStarred ? '★' : '☆';
        starBtn.title = isStarred ? 'Starred (Important) - Click to unstar' : 'Star as important';
      }
    }

    function updateSubtopicTreeItem(subId) {
      const row = document.querySelector(`.subtopic-row[data-sub-id="${subId}"]`);
      if (!row) return;
      const readSet = getReadSubtopics();
      const isRead = readSet.has(subId);
      const title = row.getAttribute('data-sub-title');

      row.classList.toggle('read-subtopic', isRead);
      const labelSpan = row.querySelector('.subtopic-label');
      if (labelSpan) {
        labelSpan.textContent = isRead ? `✓ ${title}` : `▪ ${title}`;
      }
    }

    function updateNextButton() {
      const btn = document.getElementById('btnNextCase');
      btn.disabled = !(currentCaseIndex >= 0 && currentCaseIndex < flattenedCases.length - 1);
    }

    function buildFlattenedLists() {
      flattenedCases = [];
      flattenedSubtopics = [];
      currentSyllabus.forEach(topic => {
        topic.subtopics.forEach(sub => {
          flattenedSubtopics.push({ subtopic: sub, topicTitle: topic.topic_title });
          if (sub.cases && sub.cases.length > 0) {
            sub.cases.forEach(c => {
              flattenedCases.push({
                caseItem: c,
                subtopic: sub,
                topicTitle: topic.topic_title
              });
            });
          }
        });
      });
    }

    /* 1. Parser for Middle Pane (Overview) -> Bullets, --- Dividers, & Line-Start Article Badges */
    function formatOverviewMarkdown(text) {
      if (!text) return "";
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/^\s*---+\s*$/gim, '<hr class="subtopic-divider">')
        .replace(/^####\s+(.*$)/gim, '<h4 style="font-size:1.35rem; font-weight:800; margin:14px 0 8px; color:#b45309;">$1</h4>')
        .replace(/^###\s+(.*$)/gim, '<h3 style="font-size:1.55rem; font-weight:800; margin:16px 0 10px; color:#1e293b;">$1</h3>')
        .replace(/^##\s+(.*$)/gim, '<h2 style="font-size:1.75rem; font-weight:800; margin:18px 0 12px; color:#0f172a;">$1</h2>')
        .replace(/^#\s+(.*$)/gim, '<h1 style="font-size:1.95rem; font-weight:900; margin:20px 0 14px; color:#0f172a;">$1</h1>')
        .replace(/^(?: {2,}|\t+)[-\*•]\s+(.*$)/gim, '<div class="overview-sub-bullet">◦ $1</div>')
        .replace(/^\s*[-\*•]\s+(.*$)/gim, '<div class="overview-bullet">• $1</div>')
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/(^|[^\*])\*([^\*\n]+?)\*([^\*]|$)/g, '$1<em>$2</em>$3')
        .replace(/^(\s*)(Arts?\.|Articles?)\s*(\d+[\d\w\-,\s\(\)]*?\b)/gim, function(match, spaces, prefix, num) {
          return `${spaces}<span class="article-badge">${prefix} ${num}</span>`;
        });
    }

    /* 2. Parser for Right Pane (Case Digest) -> Formats without Article Badges */
    function formatDigestMarkdown(text) {
      if (!text) return "";
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/^\s*---+\s*$/gim, '<hr style="border:0; height:1px; background:rgba(255,255,255,0.15); margin:18px 0;">')
        .replace(/^####\s+(.*$)/gim, '<h4 style="font-size:1.35rem; font-weight:800; margin:14px 0 8px; color:var(--accent-yellow);">$1</h4>')
        .replace(/^###\s+(.*$)/gim, '<h3 style="font-size:1.55rem; font-weight:800; margin:16px 0 10px; color:#f8fafc;">$1</h3>')
        .replace(/^##\s+(.*$)/gim, '<h2 style="font-size:1.75rem; font-weight:800; margin:18px 0 12px; color:#f8fafc;">$1</h2>')
        .replace(/^#\s+(.*$)/gim, '<h1 style="font-size:1.95rem; font-weight:900; margin:20px 0 14px; color:#f8fafc;">$1</h1>')
        .replace(/^\s*[-\*•]\s+(.*$)/gim, '<div style="margin-left: 18px; text-indent: -14px; margin-bottom: 6px;">• $1</div>')
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/(^|[^\*])\*([^\*\n]+?)\*([^\*]|$)/g, '$1<em>$2</em>$3');
    }

    async function initializeReviewer() {
      try {
        const response = await fetch('./syllabus.json?t=' + Date.now());
        if (!response.ok) {
          throw new Error('HTTP ' + response.status + ' (' + response.statusText + ')');
        }
        currentSyllabus = await response.json();
        buildFlattenedLists();
        renderTree();

        if (flattenedCases.length > 0) {
          const first = flattenedCases[0];
          loadOverviewText(first.subtopic);
          loadCaseFile(first.caseItem, first.subtopic.subtopic_title);
        } else if (currentSyllabus.length > 0 && currentSyllabus[0].subtopics.length > 0) {
          loadOverviewText(currentSyllabus[0].subtopics[0]);
        }
      } catch (err) {
        document.getElementById('syllabusTree').innerHTML = `
          <div style="color:#f87171; font-size:1.05rem; padding:10px;">
            <strong>Failed to load syllabus.json</strong><br><br>
            <span style="font-size:0.9rem; color:#cbd5e1;">Error: ${err.message}</span>
          </div>`;
      }
    }

    function renderTree() {
      const container = document.getElementById('syllabusTree');
      container.innerHTML = '';
      const readCases = getReadCases();
      const readSubtopics = getReadSubtopics();
      const starredCases = getStarredCases();

      currentSyllabus.forEach((topic, tIndex) => {
        const group = document.createElement('div');
        group.className = 'module-group';

        const tTitle = document.createElement('div');
        tTitle.className = 'module-header';

        const titleText = document.createElement('div');
        titleText.className = 'module-header-title';
        titleText.innerHTML = `📁 <span>${topic.topic_title}</span>`;

        const arrow = document.createElement('span');
        arrow.className = 'module-toggle-arrow';
        arrow.textContent = (tIndex === 0) ? '▼' : '▶';

        tTitle.appendChild(titleText);
        tTitle.appendChild(arrow);
        group.appendChild(tTitle);

        const subContainer = document.createElement('div');
        subContainer.className = 'module-subtopics' + (tIndex === 0 ? '' : ' collapsed');

        tTitle.onclick = () => {
          const isCollapsed = subContainer.classList.toggle('collapsed');
          arrow.textContent = isCollapsed ? '▶' : '▼';
        };

        topic.subtopics.forEach((sub, sIndex) => {
          const subKey = sub.subtopic_id || sub.subtopic_title;
          const isSubRead = readSubtopics.has(subKey);

          // Subtopic Row with Bookmark Icon
          const subRow = document.createElement('div');
          subRow.className = 'subtopic-row' + 
                             (tIndex === 0 && sIndex === 0 ? ' active' : '') +
                             (isSubRead ? ' read-subtopic' : '');
          subRow.setAttribute('data-sub-id', subKey);
          subRow.setAttribute('data-sub-title', sub.subtopic_title);

          const subLabel = document.createElement('span');
          subLabel.className = 'subtopic-label';
          subLabel.textContent = isSubRead ? `✓ ${sub.subtopic_title}` : `▪ ${sub.subtopic_title}`;

          const subMarkers = document.createElement('div');
          subMarkers.className = 'item-markers';

          const subBmBtn = document.createElement('button');
          subBmBtn.className = 'marker-btn bookmark-toggle-btn';
          subBmBtn.innerHTML = BOOKMARK_SVG;
          subBmBtn.title = 'Bookmark this subtopic';
          subBmBtn.onclick = (e) => {
            e.stopPropagation();
            toggleBookmark('subtopic', subKey);
          };

          subMarkers.appendChild(subBmBtn);
          subRow.appendChild(subLabel);
          subRow.appendChild(subMarkers);

          subRow.onclick = () => {
            document.querySelectorAll('.subtopic-row').forEach(r => r.classList.remove('active'));
            subRow.classList.add('active');
            loadOverviewText(sub);
          };
          subContainer.appendChild(subRow);

          if (sub.cases && sub.cases.length > 0) {
            const ul = document.createElement('ul');
            ul.className = 'case-tree-list';

            sub.cases.forEach((c, cIndex) => {
              const caseKey = c.id || c.title;
              const isRead = readCases.has(caseKey);
              const isStarred = starredCases.has(caseKey);

              const li = document.createElement('li');
              li.className = 'case-tree-item' + 
                             (tIndex === 0 && sIndex === 0 && cIndex === 0 ? ' active' : '') +
                             (isRead ? ' read-case' : '');
              li.setAttribute('data-case-id', caseKey);
              li.setAttribute('data-case-title', c.title);

              const titleSpan = document.createElement('span');
              titleSpan.className = 'case-title-label';
              titleSpan.textContent = isRead ? `✓ ${c.title}` : `# ${c.title}`;

              const markersDiv = document.createElement('div');
              markersDiv.className = 'item-markers';

              const starBtn = document.createElement('button');
              starBtn.className = 'marker-btn star-toggle-btn' + (isStarred ? ' starred' : '');
              starBtn.textContent = isStarred ? '★' : '☆';
              starBtn.title = isStarred ? 'Starred (Important) - Click to unstar' : 'Star as important';
              starBtn.onclick = (e) => {
                e.stopPropagation();
                toggleStarCase(caseKey);
              };

              const bmBtn = document.createElement('button');
              bmBtn.className = 'marker-btn bookmark-toggle-btn';
              bmBtn.innerHTML = BOOKMARK_SVG;
              bmBtn.title = 'Bookmark this case';
              bmBtn.onclick = (e) => {
                e.stopPropagation();
                toggleBookmark('case', caseKey);
              };

              markersDiv.appendChild(starBtn);
              markersDiv.appendChild(bmBtn);

              li.appendChild(titleSpan);
              li.appendChild(markersDiv);

              li.onclick = (e) => {
                e.stopPropagation();
                document.querySelectorAll('.case-tree-item').forEach(i => i.classList.remove('active'));
                li.classList.add('active');
                loadOverviewText(sub);
                loadCaseFile(c, sub.subtopic_title);
              };
              ul.appendChild(li);
            });
            subContainer.appendChild(ul);
          }
        });

        group.appendChild(subContainer);
        container.appendChild(group);
      });

      updateAllBookmarkUI();

      const toggleAllBtn = document.getElementById('btnToggleAll');
      toggleAllBtn.onclick = () => {
        allCollapsed = !allCollapsed;
        document.querySelectorAll('.module-subtopics').forEach(el => {
          el.classList.toggle('collapsed', allCollapsed);
        });
        document.querySelectorAll('.module-toggle-arrow').forEach(arr => {
          arr.textContent = allCollapsed ? '▶' : '▼';
        });
        toggleAllBtn.textContent = allCollapsed ? 'Expand All' : 'Collapse All';
      };
    }

    function expandParentOfElement(el) {
      if (!el) return;
      const parentModule = el.closest('.module-subtopics');
      if (parentModule && parentModule.classList.contains('collapsed')) {
        parentModule.classList.remove('collapsed');
        const parentHeader = parentModule.previousElementSibling;
        if (parentHeader) {
          const arr = parentHeader.querySelector('.module-toggle-arrow');
          if (arr) arr.textContent = '▼';
        }
      }
      el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function getSubtopicPdfPath(subtopic) {
      if (subtopic.pdf_file) return subtopic.pdf_file;
      if (subtopic.subtopic_title) {
        return `PDFs/${subtopic.subtopic_title}.pdf`;
      }
      return null;
    }

    function updatePdfToggleButton() {
      const btn = document.getElementById('btnTogglePdf');
      if (!currentSubtopicItem) {
        btn.style.display = 'none';
        return;
      }
      btn.style.display = 'inline-flex';
      if (isPdfMode) {
        btn.classList.add('active-pdf');
        btn.textContent = '📝 View Overview';
      } else {
        btn.classList.remove('active-pdf');
        btn.textContent = '📄 View PDF';
      }
    }

    async function loadOverviewText(subtopic) {
      currentSubtopicItem = subtopic;
      isPdfMode = false;
      updatePdfToggleButton();

      const subKey = subtopic.subtopic_id || subtopic.subtopic_title;
      updateOverviewReadButton(subKey);

      document.querySelectorAll('.subtopic-row').forEach(r => r.classList.remove('active'));
      const activeSubRow = document.querySelector(`.subtopic-row[data-sub-id="${subKey}"]`);
      if (activeSubRow) {
        activeSubRow.classList.add('active');
        expandParentOfElement(activeSubRow);
      }

      document.getElementById('activeSubtopicLabel').textContent = subtopic.subtopic_title;
      renderMiddlePaneContent();
    }

    async function renderMiddlePaneContent() {
      const container = document.getElementById('overviewContainer');
      if (!currentSubtopicItem) return;

      if (isPdfMode) {
        const basePath = getSubtopicPdfPath(currentSubtopicItem);
        if (!basePath) {
          container.innerHTML = `<div class="parchment-sheet">No PDF path configured for this subtopic.</div>`;
          return;
        }

        container.innerHTML = `<div class="parchment-sheet">Loading PDF...</div>`;

        const upperFilenamePath = `PDFs/${currentSubtopicItem.subtopic_title.toUpperCase()}.pdf`;
        const candidates = [basePath, upperFilenamePath];
        let validUrl = null;

        for (const path of candidates) {
          const encoded = encodeURI(path);
          try {
            const check = await fetch(encoded, { method: 'HEAD' });
            if (check.ok) {
              validUrl = encoded;
              break;
            }
          } catch (e) {}
        }

        if (!validUrl) {
          container.innerHTML = `
            <div class="parchment-sheet" style="color:#64748b;">
              <strong style="color:#ef4444;">PDF not found in the PDFs/ folder.</strong><br><br>
              Checked paths:<br>
              • <code>${basePath}</code><br>
              • <code>${upperFilenamePath}</code><br><br>
              <em>Make sure the PDF file is uploaded inside the <code>PDFs/</code> folder on GitHub.</em>
            </div>`;
          return;
        }

        container.innerHTML = `
          <iframe class="pdf-viewer-frame" src="${validUrl}">
            <div class="parchment-sheet">
              Your browser cannot display embedded PDFs directly. 
              <a href="${validUrl}" target="_blank" style="color:#0369a1; font-weight:bold;">Click here to open the PDF in a new tab.</a>
            </div>
          </iframe>
        `;
        return;
      }

      container.innerHTML = `<div class="parchment-sheet" id="overviewDisplay">Loading outline...</div>`;
      const display = document.getElementById('overviewDisplay');

      if (!currentSubtopicItem.overview_file) {
        display.textContent = 'No overview file linked for this subtopic.';
        return;
      }

      try {
        const fileUrl = encodeURI(currentSubtopicItem.overview_file);
        const res = await fetch(fileUrl);
        if (!res.ok) {
          throw new Error(`HTTP ${res.status}: File not found`);
        }
        const text = await res.text();
        display.innerHTML = formatOverviewMarkdown(text.trim()) || "(Overview file is empty)";
      } catch (err) {
        display.innerHTML = `
          <div style="color: #64748b; font-size: 1.15rem; line-height: 1.6;">
            <strong style="color: #f59e0b;">Overview outline for this section is being prepared.</strong><br><br>
            File path: <code>${currentSubtopicItem.overview_file}</code><br><br>
            <em>Once the text file is added to your Overviews folder in GitHub, its contents will appear automatically.</em>
          </div>
        `;
      }
    }

    async function loadCaseFile(caseItem, breadcrumb) {
      currentCaseItem = caseItem;
      const caseKey = caseItem.id || caseItem.title;
      
      currentCaseIndex = flattenedCases.findIndex(item => (item.caseItem.id || item.caseItem.title) === caseKey);

      updateReadButton(caseKey);
      updateNextButton();

      document.querySelectorAll('.case-tree-item').forEach(i => i.classList.remove('active'));
      const activeTreeItem = document.querySelector(`.case-tree-item[data-case-id="${caseKey}"]`);
      if (activeTreeItem) {
        activeTreeItem.classList.add('active');
        expandParentOfElement(activeTreeItem);
      }

      const display = document.getElementById('digestDisplay');
      display.innerHTML = '<p style="color:var(--text-muted); font-size:1.25rem;">Loading case digest...</p>';

      try {
        const fileUrl = encodeURI(caseItem.file);
        const res = await fetch(fileUrl);
        if (!res.ok) throw new Error(`HTTP ${res.status}: Could not load file`);
        const raw = await res.text();
        display.innerHTML = parseDigestText(raw, caseItem.title, breadcrumb);
      } catch (err) {
        display.innerHTML = `
          <p style="color:#f87171; font-size:1.2rem;">Could not load digest: <code>${caseItem.file}</code></p>
          <p style="color:var(--text-muted); font-size:1.05rem; margin-top:8px;">Verify file existence inside the <code>digests/</code> folder.</p>
        `;
      }
    }

    function parseDigestText(rawText, title, breadcrumb) {
      currentRatioText = "";

      const pattern = /(?:^|\n)\s*(?:###\s*)?(KEY DOCTRINES?|DOCTRINES?|RELEVANT FACTS|FACTS|ISSUES?|HELD|RULINGS?|RATIO DECIDENDI|RATIO|FALLO|DISPOSITIVE PORTION)[:\s-]*/i;
      const parts = rawText.split(pattern);

      let sections = {
        general: "",
        doctrines: "",
        facts: "",
        issue: "",
        held: "",
        ratio: "",
        fallo: ""
      };

      if (parts.length > 1) {
        sections.general = parts[0].trim();
        for (let i = 1; i < parts.length; i += 2) {
          const header = parts[i].toUpperCase();
          const content = (parts[i + 1] || "").trim();

          if (header.includes("DOCTRINE")) sections.doctrines = content;
          else if (header.includes("FACT")) sections.facts = content;
          else if (header.includes("ISSUE")) sections.issue = content;
          else if (header.includes("HELD") || header.includes("RULING")) sections.held = content;
          else if (header.includes("RATIO")) {
            sections.ratio = content;
            currentRatioText = content;
          }
          else if (header.includes("FALLO") || header.includes("DISPOSITIVE")) sections.fallo = content;
        }
      } else {
        sections.general = rawText.trim();
      }

      if (!currentRatioText && sections.held) {
        currentRatioText = sections.held;
      }

      let html = `
        <div class="digest-path">${breadcrumb}</div>
        <div class="case-headline">${title}</div>
      `;

      if (sections.general) {
        html += `<div class="digest-block">${formatDigestMarkdown(sections.general)}</div>`;
      }
      if (sections.doctrines) {
        html += `
          <div class="badge-label color-doctrines">⚡ KEY DOCTRINES</div>
          <div class="digest-block">${formatDigestMarkdown(sections.doctrines)}</div>
        `;
      }
      if (sections.facts) {
        html += `
          <div class="badge-label color-facts">◼ RELEVANT FACTS</div>
          <div class="digest-block">${formatDigestMarkdown(sections.facts)}</div>
        `;
      }
      if (sections.issue) {
        html += `
          <div class="badge-label color-issue">? ISSUE / ISSUES</div>
          <div class="digest-block">${formatDigestMarkdown(sections.issue)}</div>
        `;
      }
      if (sections.held) {
        html += `
          <div class="badge-label color-held">✓ HELD / RULING</div>
          <div class="digest-block">${formatDigestMarkdown(sections.held)}</div>
        `;
      }
      if (sections.ratio) {
        html += `
          <div class="badge-label color-ratio">⚖ RATIO DECIDENDI</div>
          <div class="digest-block">${formatDigestMarkdown(sections.ratio)}</div>
        `;
      }
      if (sections.fallo) {
        html += `
          <div class="badge-label color-fallo">▶ FALLO / DISPOSITIVE</div>
          <div class="digest-block">${formatDigestMarkdown(sections.fallo)}</div>
        `;
      }

      return html;
    }

    document.getElementById('btnJumpBookmark').onclick = () => {
      const bm = getBookmark();
      if (!bm) return;
      if (bm.type === 'case') {
        const found = flattenedCases.find(item => (item.caseItem.id || item.caseItem.title) === bm.id);
        if (found) {
          loadOverviewText(found.subtopic);
          loadCaseFile(found.caseItem, found.subtopic.subtopic_title);
        }
      } else if (bm.type === 'subtopic') {
        const foundSub = flattenedSubtopics.find(item => (item.subtopic.subtopic_id || item.subtopic.subtopic_title) === bm.id);
        if (foundSub) {
          loadOverviewText(foundSub.subtopic);
        }
      }
    };

    document.getElementById('btnTogglePdf').onclick = () => {
      if (!currentSubtopicItem) return;
      isPdfMode = !isPdfMode;
      updatePdfToggleButton();
      renderMiddlePaneContent();
    };

    document.getElementById('btnMarkRead').onclick = () => {
      if (currentCaseItem) {
        const caseKey = currentCaseItem.id || currentCaseItem.title;
        toggleCaseReadStatus(caseKey);
      }
    };

    document.getElementById('btnMarkOverviewRead').onclick = () => {
      if (currentSubtopicItem) {
        const subKey = currentSubtopicItem.subtopic_id || currentSubtopicItem.subtopic_title;
        toggleSubtopicReadStatus(subKey);
      }
    };

    document.getElementById('btnNextCase').onclick = () => {
      if (currentCaseIndex >= 0 && currentCaseIndex < flattenedCases.length - 1) {
        const next = flattenedCases[currentCaseIndex + 1];
        loadOverviewText(next.subtopic);
        loadCaseFile(next.caseItem, next.subtopic.subtopic_title);
      }
    };

    document.getElementById('btnCopyRatio').onclick = () => {
      if (currentRatioText) {
        navigator.clipboard.writeText(currentRatioText);
        alert("Ratio decidendi copied to clipboard!");
      } else {
        alert("No ratio found to copy.");
      }
    };

    window.addEventListener('DOMContentLoaded', initializeReviewer);
  </script>
</body>
