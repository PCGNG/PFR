<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PERSONS AND FAMILY LAW REVIEWER BY PCGNG</title>
  <style>
    :root {
      --bg-canvas: #070b13;
      --pane-dark: #0d1524;
      --border-line: #1c2a3f;
      --accent-yellow: #f59e0b;
      --accent-cyan: #38bdf8;
      --accent-pink: #f472b6;
      --cream-card: #f8f6f0;
      --cream-text: #1a1a1a;
      --text-main: #f1f5f9;
      --text-muted: #8492a6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-canvas);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Bar - Scaled 1.5x */
    header {
      background-color: #0b111c;
      border-bottom: 1px solid var(--border-line);
      padding: 0 20px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .app-title {
      font-size: 1.32rem; /* 0.88 * 1.5 */
      font-weight: 800;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge-mode {
      font-size: 0.93rem; /* 0.62 * 1.5 */
      color: #34d399;
      border: 1px solid #059669;
      background: rgba(5, 150, 105, 0.15);
      padding: 3px 10px;
      border-radius: 14px;
      font-weight: 700;
    }
    .btn-print {
      background: var(--accent-yellow);
      color: #000;
      font-weight: 700;
      font-size: 1.08rem; /* 0.72 * 1.5 */
      padding: 7px 16px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    /* 3-Pane Responsive Grid */
    .reviewer-workspace {
      display: grid;
      grid-template-columns: 340px 1.15fr 1.35fr;
      gap: 14px;
      padding: 14px;
      flex: 1;
      overflow: hidden;
    }

    .pane-card {
      background: var(--pane-dark);
      border: 1px solid var(--border-line);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .pane-titlebar {
      height: 48px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-line);
      background: rgba(11, 17, 28, 0.85);
      font-size: 1.08rem; /* 0.72 * 1.5 */
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .pane-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    /* Column 1: Syllabus Tree - Scaled 1.5x */
    .module-group { margin-bottom: 20px; }
    .module-header {
      font-size: 1.10rem; /* 0.73 * 1.5 */
      font-weight: 700;
      color: var(--accent-yellow);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .subtopic-btn {
      display: block;
      width: 100%;
      text-align: left;
      font-size: 1.12rem; /* 0.75 * 1.5 */
      color: var(--accent-cyan);
      background: transparent;
      border: none;
      padding: 7px 10px;
      border-radius: 5px;
      cursor: pointer;
      margin-left: 6px;
      line-height: 1.35;
    }
    .subtopic-btn:hover, .subtopic-btn.active {
      background: rgba(56, 189, 248, 0.15);
      font-weight: 700;
    }
    .case-tree-list {
      list-style: none;
      margin-left: 20px;
      margin-top: 6px;
      margin-bottom: 8px;
    }
    .case-tree-item {
      font-size: 1.05rem; /* 0.70 * 1.5 */
      color: #94a3b8;
      padding: 5px 8px;
      border-radius: 4px;
      cursor: pointer;
      line-height: 1.35;
    }
    .case-tree-item:hover, .case-tree-item.active {
      color: var(--accent-pink);
      background: rgba(244, 114, 182, 0.18);
      font-weight: 600;
    }

    /* Column 2: Overview (Parchment Card) - Scaled 1.5x */
    .overview-container {
      background-color: #0b111c;
      padding: 12px;
      height: 100%;
      overflow: hidden;
    }
    .parchment-sheet {
      background: var(--cream-card);
      color: var(--cream-text);
      height: 100%;
      border-radius: 8px;
      padding: 28px;
      overflow-y: auto;
      font-size: 1.35rem; /* 0.90 * 1.5 */
      line-height: 1.75;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* Column 3: Case Digest - Scaled 1.5x */
    .digest-path {
      font-size: 1.02rem; /* 0.68 * 1.5 */
      color: var(--accent-yellow);
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .case-headline {
      font-family: Georgia, serif;
      font-size: 2.02rem; /* 1.35 * 1.5 */
      font-weight: 700;
      color: #fff;
      margin-bottom: 22px;
      line-height: 1.35;
    }
    .badge-label {
      font-size: 1.10rem; /* 0.73 * 1.5 */
      font-weight: 800;
      letter-spacing: 0.05em;
      margin-top: 18px;
      margin-bottom: 8px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .color-facts { color: #f59e0b; }
    .color-issue { color: #ec4899; }
    .color-held  { color: #10b981; }
    .color-ratio { color: #38bdf8; }
    .color-fallo { color: #a78bfa; }
    .digest-block {
      margin-bottom: 20px;
      font-size: 1.28rem; /* 0.85 * 1.5 */
      color: #cbd5e1;
      line-height: 1.7;
      white-space: pre-wrap;
    }
    .btn-copy-ratio {
      background: transparent;
      border: 1px solid var(--border-line);
      color: var(--text-muted);
      font-size: 0.98rem; /* 0.65 * 1.5 */
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-copy-ratio:hover { color: #fff; border-color: #64748b; }
  </style>
</head>
<body>

  <header>
    <div class="brand-group">
      <div class="app-title">⚖️ PERSONS AND FAMILY LAW REVIEWER BY PCGNG</div>
      <div class="badge-mode">3-PANE SYLLABUS VIEW</div>
    </div>
    <button class="btn-print" onclick="window.print()">Print / PDF</button>
  </header>

  <main class="reviewer-workspace">
    <!-- Col 1: Left Pane (Syllabus Hierarchy) -->
    <section class="pane-card">
      <div class="pane-titlebar">
        <span>📁 Syllabus Hierarchy</span>
      </div>
      <div class="pane-content" id="syllabusTree">Loading syllabus...</div>
    </section>

    <!-- Col 2: Middle Pane (Topic Overview) -->
    <section class="pane-card">
      <div class="pane-titlebar">
        <span>• Topic & Sub-Topic Overview</span>
        <span style="color: var(--accent-yellow); font-size: 1.00rem;" id="activeSubtopicLabel">OVERVIEW OUTLINE</span>
      </div>
      <div class="overview-container">
        <div class="parchment-sheet" id="overviewDisplay">
          Select a topic or subtopic from the syllabus tree on the left.
        </div>
      </div>
    </section>

    <!-- Col 3: Right Pane (Case Digest) -->
    <section class="pane-card">
      <div class="pane-titlebar">
        <span># Case Digest</span>
        <button class="btn-copy-ratio" id="btnCopyRatio">Copy Ratio</button>
      </div>
      <div class="pane-content" id="digestDisplay">
        <p style="color: var(--text-muted); font-size: 1.25rem;">Select any case from the syllabus to view its digest.</p>
      </div>
    </section>
  </main>

  <script>
    let currentSyllabus = [];
    let currentRatioText = "";

    async function initializeReviewer() {
      try {
        const response = await fetch('syllabus.json');
        if (!response.ok) throw new Error('syllabus.json not found');
        currentSyllabus = await response.json();
        renderTree();

        if (currentSyllabus.length > 0 && currentSyllabus[0].subtopics.length > 0) {
          const firstSub = currentSyllabus[0].subtopics[0];
          loadOverviewText(firstSub);
          if (firstSub.cases && firstSub.cases.length > 0) {
            loadCaseFile(firstSub.cases[0], firstSub.subtopic_title);
          }
        }
      } catch (err) {
        document.getElementById('syllabusTree').innerHTML = `<p style="color:#f87171; font-size:1.15rem;">Failed to load syllabus.json. Please ensure syllabus.json is committed in the root directory.</p>`;
      }
    }

    function renderTree() {
      const container = document.getElementById('syllabusTree');
      container.innerHTML = '';

      currentSyllabus.forEach(topic => {
        const group = document.createElement('div');
        group.className = 'module-group';

        const tTitle = document.createElement('div');
        tTitle.className = 'module-header';
        tTitle.textContent = `📁 ${topic.topic_title}`;
        group.appendChild(tTitle);

        topic.subtopics.forEach((sub, sIndex) => {
          const sBtn = document.createElement('button');
          sBtn.className = 'subtopic-btn' + (sIndex === 0 ? ' active' : '');
          sBtn.textContent = `▪ ${sub.subtopic_title}`;
          sBtn.onclick = () => {
            document.querySelectorAll('.subtopic-btn').forEach(b => b.classList.remove('active'));
            sBtn.classList.add('active');
            loadOverviewText(sub);
          };
          group.appendChild(sBtn);

          if (sub.cases && sub.cases.length > 0) {
            const ul = document.createElement('ul');
            ul.className = 'case-tree-list';

            sub.cases.forEach((c, cIndex) => {
              const li = document.createElement('li');
              li.className = 'case-tree-item' + (sIndex === 0 && cIndex === 0 ? ' active' : '');
              li.textContent = `# ${c.title}`;
              li.onclick = (e) => {
                e.stopPropagation();
                document.querySelectorAll('.case-tree-item').forEach(i => i.classList.remove('active'));
                li.classList.add('active');
                loadOverviewText(sub);
                loadCaseFile(c, sub.subtopic_title);
              };
              ul.appendChild(li);
            });
            group.appendChild(ul);
          }
        });
        container.appendChild(group);
      });
    }

    async function loadOverviewText(subtopic) {
      const display = document.getElementById('overviewDisplay');
      document.getElementById('activeSubtopicLabel').textContent = subtopic.subtopic_title;
      display.textContent = 'Loading outline...';

      if (!subtopic.overview_file) {
        display.textContent = 'No overview file linked for this topic.';
        return;
      }

      try {
        const fileUrl = encodeURI(subtopic.overview_file);
        const res = await fetch(fileUrl);
        if (!res.ok) {
          throw new Error(`HTTP ${res.status}: Failed to fetch ${subtopic.overview_file}`);
        }
        const text = await res.text();
        display.textContent = text.trim() || "(Overview file is empty)";
      } catch (err) {
        display.innerHTML = `
          <strong style="color: #b91c1c;">Overview Not Found</strong><br><br>
          Could not load: <code>${subtopic.overview_file}</code><br><br>
          <em>Please check that the file path and folder name in your repository match exactly (case-sensitive).</em>
        `;
      }
    }

    async function loadCaseFile(caseItem, breadcrumb) {
      const display = document.getElementById('digestDisplay');
      display.innerHTML = '<p style="color:var(--text-muted); font-size:1.25rem;">Loading case digest...</p>';

      try {
        const fileUrl = encodeURI(caseItem.file);
        const res = await fetch(fileUrl);
        if (!res.ok) throw new Error(`HTTP ${res.status}: Could not load file`);
        const raw = await res.text();
        display.innerHTML = parseDigestText(raw, caseItem.title, breadcrumb);
      } catch (err) {
        display.innerHTML = `
          <p style="color:#f87171; font-size:1.2rem;">Could not load digest: <code>${caseItem.file}</code></p>
          <p style="color:var(--text-muted); font-size:1.05rem; margin-top:8px;">Verify file existence inside the <code>digests/</code> folder.</p>
        `;
      }
    }

    function parseDigestText(rawText, title, breadcrumb) {
      currentRatioText = "";

      const pattern = /(?:^|\n)\s*(?:###\s*)?(RELEVANT FACTS|FACTS|ISSUE|ISSUES|HELD|RULING|RATIO DECIDENDI|RATIO|FALLO|DISPOSITIVE PORTION)[:\s-]*/i;
      const parts = rawText.split(pattern);

      let sections = {
        general: "",
        facts: "",
        issue: "",
        held: "",
        ratio: "",
        fallo: ""
      };

      if (parts.length > 1) {
        sections.general = parts[0].trim();
        for (let i = 1; i < parts.length; i += 2) {
          const header = parts[i].toUpperCase();
          const content = (parts[i + 1] || "").trim();

          if (header.includes("FACT")) sections.facts = content;
          else if (header.includes("ISSUE")) sections.issue = content;
          else if (header.includes("HELD") || header.includes("RULING")) sections.held = content;
          else if (header.includes("RATIO")) {
            sections.ratio = content;
            currentRatioText = content;
          }
          else if (header.includes("FALLO") || header.includes("DISPOSITIVE")) sections.fallo = content;
        }
      } else {
        sections.general = rawText.trim();
      }

      if (!currentRatioText && sections.held) {
        currentRatioText = sections.held;
      }

      let html = `
        <div class="digest-path">${breadcrumb}</div>
        <div class="case-headline">${title}</div>
      `;

      if (sections.general) {
        html += `<div class="digest-block">${sections.general}</div>`;
      }
      if (sections.facts) {
        html += `
          <div class="badge-label color-facts">◼ RELEVANT FACTS</div>
          <div class="digest-block">${sections.facts}</div>
        `;
      }
      if (sections.issue) {
        html += `
          <div class="badge-label color-issue">? ISSUE</div>
          <div class="digest-block">${sections.issue}</div>
        `;
      }
      if (sections.held) {
        html += `
          <div class="badge-label color-held">✓ HELD / RULING</div>
          <div class="digest-block">${sections.held}</div>
        `;
      }
      if (sections.ratio) {
        html += `
          <div class="badge-label color-ratio">⚖ RATIO DECIDENDI</div>
          <div class="digest-block">${sections.ratio}</div>
        `;
      }
      if (sections.fallo) {
        html += `
          <div class="badge-label color-fallo">▶ FALLO</div>
          <div class="digest-block">${sections.fallo}</div>
        `;
      }

      return html;
    }

    document.getElementById('btnCopyRatio').onclick = () => {
      if (currentRatioText) {
        navigator.clipboard.writeText(currentRatioText);
        alert("Ratio decidendi copied to clipboard!");
      } else {
        alert("No ratio found to copy.");
      }
    };

    window.addEventListener('DOMContentLoaded', initializeReviewer);
  </script>
</body>
</html>
