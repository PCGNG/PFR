<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Persons and Family Law Review by PCGNG</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { display: flex; flex-direction: column; height: 100vh; background: #0b1329; color: #f1f5f9; }
    header { padding: 12px 24px; background: #111e38; border-bottom: 1px solid #1e3a8a; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    header h1 { font-size: 1.15rem; color: #f472b6; }
    .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    select, button.nav-btn, label.upload-btn { padding: 8px 12px; border-radius: 6px; background: #1d283a; color: #f1f5f9; border: 1px solid #3b82f6; cursor: pointer; font-size: 0.88rem; }
    select:hover, button.nav-btn:hover, label.upload-btn:hover { background: #25344f; border-color: #f472b6; }
    button.nav-btn:disabled { opacity: 0.4; cursor: not-allowed; border-color: #1e3a8a; }
    input[type="file"] { display: none; }
    
    .split-container { display: flex; flex: 1; overflow: hidden; }
    .pane { overflow-y: auto; padding: 20px; line-height: 1.7; text-align: justify; }
    
    /* Left Pane: Syllabus Hierarchy */
    .left-pane { width: 320px; min-width: 260px; border-right: 1px solid #1e3a8a; background: #070c1b; font-size: 0.88rem; }
    
    /* Middle and Right Panes: Equal width sizing */
    .middle-pane { flex: 1; border-right: 1px solid #1e3a8a; background: #111e38; font-size: 0.85rem; }
    .right-pane { flex: 1; background: #111e38; font-size: 0.95rem; }

    .digest-card { max-width: 100%; margin: 0 auto; background: #0b1329; padding: 24px; border-radius: 8px; border: 1px solid #1e3a8a; white-space: pre-wrap; }
    .digest-card h1, .digest-card h2, .digest-card h3, .pane h2, .pane h3 { color: #f472b6; margin-bottom: 8px; margin-top: 14px; text-align: left; }
    .digest-card strong, .pane strong { color: #60a5fa; }
    .digest-card em, .pane em { font-style: italic; color: #fbcfe8; }
    
    /* Collapsible Tree Styles */
    .folder-header { cursor: pointer; font-weight: 600; color: #fde047; margin-top: 12px; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; user-select: none; }
    .folder-header:hover { color: #fef08a; }
    .folder-content { padding-left: 14px; display: none; border-left: 1px dashed #1e3a8a; margin-left: 6px; }
    .folder-content.open { display: block; }
    
    .back-overview-btn { display: inline-block; margin-top: 24px; padding: 10px 16px; background: #1d283a; color: #f472b6; border: 1px solid #3b82f6; border-radius: 6px; cursor: pointer; font-size: 0.9rem; text-decoration: none; font-weight: 500; }
    .back-overview-btn:hover { background: #25344f; color: #ffffff; border-color: #f472b6; }
    
    @media (max-width: 1000px) { .split-container { flex-direction: column; } .left-pane, .middle-pane, .right-pane { width: 100%; border-right: none; border-bottom: 1px solid #1e3a8a; } }
  </style>
</head>
<body>

  <header>
    <h1>⚖️ Persons and Family Law Review by PCGNG</h1>
    <div class="controls">
      <!-- Dropdown 1: Topics -->
      <select id="topicSelector" onchange="onTopicChange()">
        <option value="">Loading topics...</option>
      </select>

      <!-- Prev / Next Navigation -->
      <button class="nav-btn" id="prevBtn" onclick="changeCase(-1)" title="Previous Case">◀ Prev</button>
      
      <!-- Dropdown 2: Cases -->
      <select id="caseSelector" onchange="displaySelectedCase()">
        <option value="">-- All Cases / Topic Overview --</option>
      </select>

      <button class="nav-btn" id="nextBtn" onclick="changeCase(1)" title="Next Case">Next ▶</button>

      <label class="upload-btn">
        📄 Upload Digest
        <input type="file" accept=".txt,.md" onchange="uploadDigest(event)">
      </label>
    </div>
  </header>

  <div class="split-container">
    <!-- Left Pane: Collapsible Syllabus Hierarchy -->
    <div class="pane left-pane">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <h3 style="color:#f472b6; font-size: 0.95rem; margin:0;">📑 SYLLABUS HIERARCHY</h3>
        <button onclick="toggleAllFolders()" style="background:#1d283a; color:#60a5fa; border:1px solid #3b82f6; padding:3px 8px; border-radius:4px; font-size:0.75rem; cursor:pointer;">Expand All</button>
      </div>
      <div id="hierarchyContent" style="color:#93c5fd; font-size: 0.85rem;">Select a topic above.</div>
    </div>

    <!-- Middle Pane: Topic Overview Notes (Smaller Font, Justified) -->
    <div class="pane middle-pane">
      <div class="digest-card" id="leftPaneContent">
        <h2 style="color:#f472b6;">📚 Topic Overview</h2>
        <p style="color:#93c5fd;">Select a topic to view notes.</p>
      </div>
    </div>

    <!-- Right Pane: Case Digest (Justified) -->
    <div class="pane right-pane">
      <div class="digest-card" id="digestContent">Select a case to view details.</div>
    </div>
  </div>

  <script>
    const USER = "PCGNG";
    const REPO = "PFR";
    let topicsData = {};
    let allExpanded = false;

    async function loadTopics() {
      const topicSelector = document.getElementById('topicSelector');
      try {
        const res = await fetch(`https://api.github.com/repos/${USER}/${REPO}/contents/digests`);
        if (!res.ok) throw new Error("Could not access digests directory");
        const items = await res.json();

        const folders = items.filter(i => i.type === "dir");
        if (folders.length === 0) {
          topicSelector.innerHTML = '<option>No topic folders found in digests/</option>';
          return;
        }

        topicsData = {};
        topicSelector.innerHTML = '';

        for (const folder of folders) {
          const topicName = folder.name;
          topicsData[topicName] = { cases: [], topicNotePath: `digests/${topicName}.txt` };

          const subRes = await fetch(folder.url);
          if (subRes.ok) {
            const subFiles = await subRes.json();
            const txtFiles = subFiles.filter(f => /\.txt$/i.test(f.name));

            txtFiles.forEach(txt => {
              const rawTitle = txt.name.replace(/\.[^/.]+$/, "");
              topicsData[topicName].cases.push({
                title: rawTitle,
                topic: topicName,
                digestPath: txt.path
              });
            });
          }

          const opt = document.createElement('option');
          opt.value = topicName;
          opt.textContent = topicName;
          topicSelector.appendChild(opt);
        }

        if (folders.length > 0) {
          topicSelector.value = folders[0].name;
          onTopicChange();
          buildLeftHierarchy();
        }

      } catch (e) {
        topicSelector.innerHTML = '<option>Failed to load topics</option>';
        console.error(e);
      }
    }

    async function onTopicChange() {
      const topicSelector = document.getElementById('topicSelector');
      const caseSelector = document.getElementById('caseSelector');
      const selectedTopic = topicSelector.value;

      caseSelector.innerHTML = '<option value="overview">📂 [View Topic Overview / Case List]</option>';
      if (!selectedTopic || !topicsData[selectedTopic]) return;

      const topicInfo = topicsData[selectedTopic];
      topicInfo.cases.forEach((item, index) => {
        const opt = document.createElement('option');
        opt.value = index;
        opt.textContent = item.title;
        caseSelector.appendChild(opt);
      });

      caseSelector.value = "overview";
      loadTopicNotesIntoMiddlePane(selectedTopic);
      displayTopicOverviewRightPane();
      highlightActiveFolder(selectedTopic);
    }

    async function loadTopicNotesIntoMiddlePane(topicName) {
      const topicInfo = topicsData[topicName];
      const middlePane = document.getElementById('leftPaneContent');
      middlePane.innerHTML = `<h2 style="color:#f472b6;">📚 ${topicName}</h2><p style="color:#93c5fd;">Loading topic notes...</p>`;

      try {
        const res = await fetch(topicInfo.topicNotePath);
        if (res.ok) {
          const text = await res.text();
          middlePane.innerHTML = `<h2 style="color:#f472b6;">📚 ${topicName}</h2><hr style="margin:16px 0; border-color:#1e3a8a;">` + marked.parse(text);
        } else {
          throw new Error("No custom notes");
        }
      } catch (err) {
        middlePane.innerHTML = `
          <h2 style="color:#f472b6;">📚 ${topicName}</h2>
          <hr style="margin:16px 0; border-color:#1e3a8a;">
          <p style="color:#93c5fd;">No custom overview text file found for this topic yet.</p>
          <p style="color:#94a3b8; font-size:0.8rem; margin-top:10px;">Tip: Create <b>${topicName}.txt</b> inside your root <b>digests/</b> folder.</p>
        `;
      }
    }

    function buildLeftHierarchy() {
      const hierarchyBox = document.getElementById('hierarchyContent');
      let html = '';

      for (const topicName in topicsData) {
        const topicInfo = topicsData[topicName];
        html += `
          <div class="folder-group" data-topic="${topicName}">
            <div class="folder-header" onclick="toggleFolder(this)">
              <span>📁</span> <span>${topicName}</span>
            </div>
            <div class="folder-content">
              <ul style="padding-left:12px; list-style-type:none; margin:6px 0;">
                <li style="margin-bottom:4px;"><a href="#" onclick="selectOverview('${topicName}'); return false;" style="color:#f472b6; text-decoration:none; font-size:0.8rem;">📋 View Topic Overview</a></li>
        `;

        topicInfo.cases.forEach((c, i) => {
          html += `<li style="margin-bottom:6px;"><a href="#" onclick="selectCaseFromHierarchy('${topicName}', ${i}); return false;" style="color:#60a5fa; text-decoration:none; display:block;"># ${c.title}</a></li>`;
        });

        html += `</ul></div></div>`;
      }

      hierarchyBox.innerHTML = html;
      highlightActiveFolder(document.getElementById('topicSelector').value);
    }

    function toggleFolder(headerElement) {
      const content = headerElement.nextElementSibling;
      content.classList.toggle('open');
    }

    function toggleAllFolders() {
      allExpanded = !allExpanded;
      const contents = document.querySelectorAll('.folder-content');
      contents.forEach(el => {
        if (allExpanded) el.classList.add('open');
        else el.classList.remove('open');
      });
      event.target.textContent = allExpanded ? "Collapse All" : "Expand All";
    }

    function highlightActiveFolder(activeTopic) {
      document.querySelectorAll('.folder-group').forEach(group => {
        const content = group.querySelector('.folder-content');
        if (group.getAttribute('data-topic') === activeTopic) {
          content.classList.add('open');
          group.querySelector('.folder-header').style.color = '#f472b6';
        } else {
          group.querySelector('.folder-header').style.color = '#fde047';
        }
      });
    }

    function selectOverview(topicName) {
      const topicSelector = document.getElementById('topicSelector');
      topicSelector.value = topicName;
      onTopicChange();
    }

    function selectCaseFromHierarchy(topicName, caseIndex) {
      const topicSelector = document.getElementById('topicSelector');
      topicSelector.value = topicName;
      
      // Trigger topic change without resetting case selector if same topic
      const caseSelector = document.getElementById('caseSelector');
      if (caseSelector.options.length <= 1) {
        onTopicChange().then(() => {
          caseSelector.value = caseIndex;
          displaySelectedCase();
        });
      } else {
        caseSelector.value = caseIndex;
        loadTopicNotesIntoMiddlePane(topicName);
        displaySelectedCase();
      }
      highlightActiveFolder(topicName);
    }

    function displayTopicOverviewRightPane() {
      const topicSelector = document.getElementById('topicSelector');
      const selectedTopic = topicSelector.value;
      const topicInfo = topicsData[selectedTopic];

      document.getElementById('prevBtn').disabled = true;
      document.getElementById('nextBtn').disabled = true;

      let caseListHTML = topicInfo.cases.length > 0 
        ? topicInfo.cases.map((c, i) => `<li style="margin-bottom: 10px;"><a href="#" onclick="selectCaseFromOverview(${i}); return false;" style="color: #60a5fa; text-decoration: none; font-weight: 500;">${c.title}</a></li>`).join('')
        : '<li>No cases uploaded for this topic yet.</li>';

      const contentBox = document.getElementById('digestContent');
      contentBox.innerHTML = `
        <h2 style="color:#f472b6;">📋 Case List for ${selectedTopic}</h2>
        <p style="color:#93c5fd; font-size:0.9rem; margin-bottom:16px;">Select any case below to view its full text digest on this screen.</p>
        <hr style="margin:12px 0; border-color:#1e3a8a;">
        <ul style="padding-left: 20px; line-height: 1.8; margin-top: 14px; text-align: left;">${caseListHTML}</ul>
      `;
    }

    function selectCaseFromOverview(caseIndex) {
      const caseSelector = document.getElementById('caseSelector');
      caseSelector.value = caseIndex;
      displaySelectedCase();
    }

    async function displaySelectedCase() {
      const caseSelector = document.getElementById('caseSelector');
      if (caseSelector.value === "overview") {
        displayTopicOverviewRightPane();
        return;
      }

      const topicSelector = document.getElementById('topicSelector');
      const selectedTopic = topicSelector.value;
      const idx = parseInt(caseSelector.value);

      if (!selectedTopic || isNaN(idx) || !topicsData[selectedTopic]) return;
      const cases = topicsData[selectedTopic].cases;
      const item = cases[idx];

      document.getElementById('prevBtn').disabled = (idx === 0);
      document.getElementById('nextBtn').disabled = (idx === cases.length - 1);

      const contentBox = document.getElementById('digestContent');
      contentBox.innerHTML = `<h2 style="color:#f472b6;">${item.title}</h2><p style="color:#60a5fa; font-size:0.85rem; margin-bottom:12px;">Topic: ${item.topic}</p><p style="color:#93c5fd;">Loading case digest file...</p>`;

      try {
        const res = await fetch(item.digestPath);
        if (!res.ok) throw new Error("File not found");
        const text = await res.text();
        
        const backButtonHTML = `<hr style="margin:32px 0 16px 0; border-color:#1e3a8a;"><button onclick="goToOverview()" class="back-overview-btn">⬅️ Back to Case List</button>`;
        
        contentBox.innerHTML = `<h2 style="color:#f472b6;">${item.title}</h2><p style="color:#60a5fa; font-size:0.85rem; margin-bottom:12px;">Topic: ${item.topic}</p><hr style="margin:12px 0; border-color:#1e3a8a;">` + marked.parse(text) + backButtonHTML;
      } catch (err) {
        contentBox.innerHTML = `
          <h2 style="color:#f472b6;">${item.title}</h2>
          <p style="color:#60a5fa; font-size:0.85rem; margin-bottom:12px;">Topic: ${item.topic}</p>
          <hr style="margin:12px 0; border-color:#1e3a8a;">
          <p style="color:#f87171;">Digest file not found at <code>${item.digestPath}</code></p>
          <button onclick="goToOverview()" class="back-overview-btn">⬅️ Back to Case List</button>
        `;
      }
    }

    function goToOverview() {
      const caseSelector = document.getElementById('caseSelector');
      caseSelector.value = "overview";
      displayTopicOverviewRightPane();
    }

    function changeCase(direction) {
      const caseSelector = document.getElementById('caseSelector');
      if (caseSelector.value === "overview") return;

      const topicSelector = document.getElementById('topicSelector');
      const cases = topicsData[topicSelector.value].cases;
      
      let newIdx = parseInt(caseSelector.value) + direction;
      if (cases && newIdx >= 0 && newIdx < cases.length) {
        caseSelector.value = newIdx;
        displaySelectedCase();
      }
    }

    function uploadDigest(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = e => {
          const backButtonHTML = `<hr style="margin:32px 0 16px 0; border-color:#1e3a8a;"><button onclick="goToOverview()" class="back-overview-btn">⬅️ Back to Case List</button>`;
          document.getElementById('digestContent').innerHTML = `<h2 style="color:#f472b6;">${file.name}</h2><hr style="margin:12px 0; border-color:#1e3a8a;">` + marked.parse(e.target.result) + backButtonHTML;
        };
        reader.readAsText(file);
      }
    }

    loadTopics();
  </script>
</body>
</html>
